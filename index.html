<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>卜品Origo · 咨询指南与真实评价</title>
  <style>
    /* 所有 CSS 样式保持不变，已在之前代码中提供，此处省略以节省篇幅，实际使用时请复制完整版 */
    :root { --brand-green: #07C160; /* ...其余变量... */ }
    body { font-family: -apple-system, sans-serif; background: #f9fafb; }
    /* ... 完整样式请参考之前提供过的最终版 ... */
  </style>
</head>
<body>
  <!-- 页面 HTML 结构，已包含关于我、价目表、真实评价等模块 -->

  <script>
    // ========== 你的 Supabase 配置 ==========
    const SUPABASE_URL = 'https://cmvvokqwdpvmkcxxzlgj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_O8pCMhQmfXxbq8r7IN87Pw_QpY8liuo';
    const USE_LOCAL_STORAGE = false;  // 强制使用云数据库
    const ADMIN_PASSWORD = '000000';

    // 通用请求函数
    async function supabaseFetch(path, options = {}) {
      const url = `${SUPABASE_URL}/rest/v1/${path}`;
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        ...options.headers
      };
      const res = await fetch(url, { ...options, headers });
      if (!res.ok) throw new Error(`请求失败: ${res.status}`);
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    async function supabaseRPC(functionName, body) {
      const url = `${SUPABASE_URL}/rest/v1/rpc/${functionName}`;
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      };
      const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(`RPC失败: ${res.status}`);
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    let isAdmin = false;

    // 标签切换
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
      if (tabName === 'reviews') loadReviews();
    }

    // 弹窗控制
    function openModal(id) { document.getElementById(id).style.display = 'flex'; document.body.style.overflow = 'hidden'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; document.body.style.overflow = ''; }

    function openReviewModal() {
      document.getElementById('reviewContent').value = '';
      document.getElementById('reviewNickname').value = '';
      document.getElementById('inviteCodeInput').value = '';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = '提交反馈';
      openModal('reviewModal');
    }
    function closeReviewModal() { closeModal('reviewModal'); }
    function openAdminLogin() { document.getElementById('adminPassword').value = ''; openModal('adminLoginModal'); }
    function closeAdminLogin() { closeModal('adminLoginModal'); }
    function openAdminPanel() { closeModal('adminLoginModal'); openModal('adminPanelModal'); loadAdminData(); }
    function closeAdminPanel() { closeModal('adminPanelModal'); isAdmin = false; loadReviews(); }

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        const id = e.target.id;
        if (id === 'reviewModal') closeReviewModal();
        if (id === 'adminLoginModal') closeAdminLogin();
        if (id === 'adminPanelModal') closeAdminPanel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('adminPanelModal').style.display === 'flex') closeAdminPanel();
        else if (document.getElementById('adminLoginModal').style.display === 'flex') closeAdminLogin();
        else if (document.getElementById('reviewModal').style.display === 'flex') closeReviewModal();
      }
    });

    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : ''}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = '0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // 加载评价
    async function loadReviews() {
      const container = document.getElementById('reviewsList');
      container.innerHTML = '<div style="text-align:center;padding:28px;"><div class="loading-spinner"></div></div>';
      try {
        const reviews = await supabaseFetch('reviews?select=*&is_hidden=eq.false&order=is_pinned.desc,created_at.desc&limit=50');
        renderReviews(reviews || []);
        updateVisitorCount((reviews || []).length);
      } catch (e) {
        container.innerHTML = '<div class="empty-reviews">暂时无法加载评价，请稍后再试</div>';
        document.getElementById('visitorFeedbackText').textContent = '';
      }
    }

    function renderReviews(reviews) {
      const container = document.getElementById('reviewsList');
      if (!reviews.length) {
        container.innerHTML = '<div class="empty-reviews">暂无反馈，期待你的第一条真实感受</div>';
        return;
      }
      container.innerHTML = reviews.map(r => {
        const initial = (r.nickname || '匿')[0].toUpperCase();
        const time = formatTime(r.created_at);
        return `<div class="review-card ${r.is_pinned ? 'pinned' : ''}">
          ${r.is_pinned ? '<span class="pinned-badge">置顶</span>' : ''}
          <div class="review-header">
            <div class="review-avatar">${initial}</div>
            <span class="review-nickname">${escapeHTML(r.nickname || '匿名')}</span>
            <span class="review-time">${time}</span>
          </div>
          ${r.content ? `<div class="review-content">${escapeHTML(r.content)}</div>` : ''}
        </div>`;
      }).join('');
    }

    function updateVisitorCount(count) {
      document.getElementById('visitorFeedbackText').textContent = 
        count > 0 ? `已有${count}位来访者，在这里留下他们的反馈。` : '期待第一位来访者的反馈';
    }

    function formatTime(d) {
      if (!d) return '';
      const n = new Date(), diff = n - new Date(d);
      const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), day = Math.floor(diff/86400000);
      if (m < 1) return '刚刚';
      if (m < 60) return m + '分钟前';
      if (h < 24) return h + '小时前';
      if (day < 30) return day + '天前';
      return `${new Date(d).getFullYear()}-${String(new Date(d).getMonth()+1).padStart(2,'0')}-${String(new Date(d).getDate()).padStart(2,'0')}`;
    }

    function escapeHTML(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // 提交评价
    async function submitReview() {
      const code = document.getElementById('inviteCodeInput').value.trim();
      const nickname = document.getElementById('reviewNickname').value.trim() || '匿名';
      const content = document.getElementById('reviewContent').value.trim();
      const btn = document.getElementById('submitBtn');

      if (!code) return showToast('请输入邀请码', 'error');
      if (!content) return showToast('请填写评价内容', 'error');

      btn.disabled = true;
      btn.textContent = '提交中…';
      try {
        const result = await supabaseRPC('submit_review', {
          p_invite_code: code,
          p_nickname: nickname,
          p_rating: 5,
          p_content: content
        });
        if (result?.success) {
          showToast('反馈提交成功！', 'success');
          closeReviewModal();
          loadReviews();
        } else {
          showToast(result?.message || '邀请码无效或已使用', 'error');
        }
      } catch (e) {
        showToast('提交失败，请重试', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '提交反馈';
      }
    }

    // 管理员登录
    function adminLogin() {
      if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
        isAdmin = true;
        showToast('已进入管理后台', 'success');
        openAdminPanel();
      } else {
        showToast('密码错误', 'error');
      }
    }

    // 加载管理数据
    async function loadAdminData() {
      try {
        const codes = await supabaseFetch('invite_codes?select=*&order=created_at.desc&limit=100');
        const reviews = await supabaseFetch('reviews?select=*&order=created_at.desc&limit=100');
        renderAllCodes(codes || []);
        renderAdminReviews(reviews || []);
      } catch (e) {
        showToast('加载管理数据失败', 'error');
      }
    }

    function renderAllCodes(codes) {
      const el = document.getElementById('allCodesList');
      el.innerHTML = codes.length
        ? codes.map(c => `<span class="code-tag ${c.is_used?'used':''}" onclick="copyCode('${c.code}')">${c.code}${c.is_used?' (已用)':''}</span>`).join('')
        : '暂无邀请码';
    }

    function renderAdminReviews(reviews) {
      const container = document.getElementById('adminReviewsList');
      if (!reviews.length) {
        container.innerHTML = '<div style="padding:8px;color:#999;">暂无评价</div>';
        return;
      }
      container.innerHTML = reviews.map(r => `
        <div class="admin-review-row">
          <div class="admin-review-info">
            <b>${escapeHTML(r.nickname||'匿名')}</b>
            ${r.is_pinned?'<span class="pin-indicator">📌置顶</span>':''}
            <span style="color:#999;font-size:0.7rem;margin-left:6px;">${formatTime(r.created_at)}</span>
            ${r.is_hidden?'<span style="color:#e65050;font-size:0.65rem;">[已隐藏]</span>':''}
            <div style="font-size:0.8rem;color:#555;">${escapeHTML((r.content||'').substring(0,30))}…</div>
          </div>
          <div class="admin-review-actions">
            <button class="btn btn-sm ${r.is_pinned?'btn-pin':'btn-outline'}" onclick="togglePin(${r.id},${r.is_pinned})">${r.is_pinned?'取消置顶':'置顶'}</button>
            <button class="btn btn-sm ${r.is_hidden?'btn-outline':'btn-danger'}" onclick="toggleHidden(${r.id},${r.is_hidden})">${r.is_hidden?'显示':'隐藏'}</button>
            <button class="btn btn-sm btn-warning" onclick="deleteReview(${r.id})">删除</button>
          </div>
        </div>
      `).join('');
    }

    async function togglePin(id, current) {
      await supabaseFetch(`reviews?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ is_pinned: !current }) });
      loadAdminData(); loadReviews();
      showToast(current ? '已取消置顶' : '已置顶', 'success');
    }

    async function toggleHidden(id, current) {
      await supabaseFetch(`reviews?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ is_hidden: !current }) });
      loadAdminData(); loadReviews();
      showToast(current ? '评价已显示' : '评价已隐藏', 'success');
    }

    async function deleteReview(id) {
      if (!confirm('确定要永久删除这条评价吗？')) return;
      await supabaseFetch(`reviews?id=eq.${id}`, { method: 'DELETE' });
      showToast('评价已删除', 'success');
      loadAdminData(); loadReviews();
    }

    async function generateInviteCodes() {
      const count = Math.min(20, Math.max(1, parseInt(document.getElementById('genCodeCount').value) || 5));
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const newCodes = [];
      for (let i = 0; i < count; i++) {
        let code = '';
        for (let j = 0; j < 4; j++) code += chars[Math.floor(Math.random() * chars.length)];
        newCodes.push({ code, is_used: false });
      }
      try {
        const result = await supabaseFetch('invite_codes', { method: 'POST', body: JSON.stringify(newCodes) });
        const createdCodes = result || newCodes;
        document.getElementById('newCodesList').innerHTML = createdCodes.map(c => `<span class="code-tag" onclick="copyCode('${c.code}')">${c.code}</span>`).join('');
        showToast(`已生成 ${createdCodes.length} 个邀请码`, 'success');
        loadAdminData();
      } catch (e) {
        showToast('生成失败，请重试', 'error');
      }
    }

    function copyCode(code) {
      navigator.clipboard?.writeText(code).then(() => showToast('已复制: ' + code)).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制');
      });
    }

    // 启动加载评价
    loadReviews();
  </script>
</body>
</html>
